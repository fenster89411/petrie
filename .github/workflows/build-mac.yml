name: Build Multi-Architecture macOS Apps

on:
  push:
    branches: [ main ]

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: Apple-Silicon
            runner: macos-latest
            artifact_name: PetrieQuote-macOS-AppleSilicon
          - arch: Intel
            runner: macos-15-intel
            artifact_name: PetrieQuote-macOS-Intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "PetrieQuote" \
            --add-data "index.html:." \
            --add-data "images:images" \
            --add-data "assets:assets" \
            SERVER.PY

      - name: Compress App Bundle
        run: |
          cd dist
          zip -r ${{ matrix.artifact_name }}.zip PetrieQuote.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip