name: Build macOS Executable

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "PetrieQuote" --add-data "index.html:." SERVER.PY
          
          # 1. Stage into Contents/MacOS/
          mkdir -p dist/PetrieQuote.app/Contents/MacOS/assets
          mkdir -p dist/PetrieQuote.app/Contents/MacOS/images
          cp -r assets/* dist/PetrieQuote.app/Contents/MacOS/assets/ 2>/dev/null || true
          cp -r images/* dist/PetrieQuote.app/Contents/MacOS/images/ 2>/dev/null || true
          cp logo.* Logo.* LOGO.* dist/PetrieQuote.app/Contents/MacOS/ 2>/dev/null || true
          cp clients.json presets.json terms.json images.json dist/PetrieQuote.app/Contents/MacOS/ 2>/dev/null || true

          # 2. Stage into Contents/Resources/ (where index.html resides)
          mkdir -p dist/PetrieQuote.app/Contents/Resources/assets
          mkdir -p dist/PetrieQuote.app/Contents/Resources/images
          cp -r assets/* dist/PetrieQuote.app/Contents/Resources/assets/ 2>/dev/null || true
          cp -r images/* dist/PetrieQuote.app/Contents/Resources/images/ 2>/dev/null || true
          cp logo.* Logo.* LOGO.* dist/PetrieQuote.app/Contents/Resources/ 2>/dev/null || true

      - name: Compress App Bundle
        run: |
          cd dist
          zip -r PetrieQuote-macOS.zip PetrieQuote.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetrieQuote-macOS
          path: dist/PetrieQuote-macOS.zip