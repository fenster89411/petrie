name: Build Multi-Architecture macOS Apps

on:
  push:
    branches: [ main ]

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: Apple-Silicon
            runner: macos-latest
            artifact_name: PetrieQuote-macOS-AppleSilicon
          - arch: Intel
            runner: macos-15-intel
            artifact_name: PetrieQuote-macOS-Intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Generate 'P' Tape Measure Icon Inline
        run: |
          python -c "
          from PIL import Image, ImageDraw
          import os
          os.makedirs('assets', exist_ok=True)
          img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          brand_color = '#3b4876'
          draw.polygon([(390, 160), (425, 30), (445, 78), (415, 170)], fill=brand_color)
          draw.polygon([(425, 30), (500, 60), (485, 98), (445, 78)], fill=brand_color)
          draw.ellipse([60, 160, 340, 440], fill=brand_color)
          draw.polygon([(185, 161), (415, 200), (318, 395)], fill=brand_color)
          draw.ellipse([110, 210, 290, 390], fill='#ffffff')
          draw.rectangle([152, 240, 182, 360], fill=brand_color)
          draw.rounded_rectangle([152, 240, 248, 310], radius=25, fill=brand_color)
          draw.rounded_rectangle([182, 260, 220, 290], radius=12, fill='#ffffff')
          img.save('assets/icon.png')
          "
          rm -rf icon.iconset assets/icon.icns
          mkdir icon.iconset
          sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o assets/icon.icns

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "PetrieQuote" \
            --icon "assets/icon.icns" \
            --add-data "index.html:." \
            --add-data "images:images" \
            --add-data "assets:assets" \
            SERVER.PY

      - name: Compress App Bundle
        run: |
          cd dist
          zip -r ${{ matrix.artifact_name }}.zip PetrieQuote.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip